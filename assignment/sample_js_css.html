<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Introduction</title>
   <style>body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #74ebd5, #acb6e5);
    text-align: center;
    margin: 0;
    padding: 0;
}

.container {
    background: white;
    width: 300px;
    margin: 100px auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
}

.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
}

h1 {
    color: #333;
}

.bio {
    color: #555;
}

button {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px 15px;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background-color: #45a049;
}</style>
</head>
<body>

    <div class="container">
        <img src="https://via.placeholder.com/150" alt="Profile Picture" class="profile-img">
        
        <h1 id="name">Hello, I'm Nithish Devadiga</h1>
        <p class="bio">
            I am a web developer passionate about creating simple and beautiful websites.
        </p>

        <button onclick="showMessage()">Click to Know More</button>

        <p id="extra-info"></p>
    </div>

    <script >function showMessage() {
    // Ask user name
    let name = prompt("What is your name?");

    // Ask user interest
    let interest = prompt("What do you like to do?");

    // Show greeting message
    alert("Hello " + name + "! 😊");

    // Show interest message
    alert("That's awesome! I also like " + interest + "!");

    // Display on page
    document.getElementById("extra-info").innerText =
        "Nice to meet you, " + name + "! You enjoy " + interest + ".";
}
</script>
</body>
</html>
