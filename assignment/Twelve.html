<!DOCTYPE html>

<html>

<head>

 <link rel="stylesheet" href="do.css">

</head>

  <body>

<h2>Skill Matrix</h2>

<ol type="a">

 <li>Frontend Development

 <ul id="frontend">

 <li>HTML</li>

 <li>CSS</li>

 <li>JavaScript</li>

 </ul>

 </li>

 

 <li>Styling & Framework

 <ul id="framework">

 <li>Bootstrap</li>

 <li>Tailwind CSS</li>

 </ul>

 </li>

</ol> 

<button onclick="addSkills()">Add Skills</button>

<script src="do.js"></script>

</body>
  
</html>

body {

<style>

font-family: Arial, sans-serif;

 background-color: #f5f5f5;

 margin: 20px;

 text-align: center;

}

h2 {

 color: #333;

}

ol {

 background: #ec9393;

 padding: 20px;

 border-radius: 8px;

 width: 300px;

 margin: 20px auto;

 text-align: left;

}

li {

 margin: 8px 0;

}

ul {

 margin-top: 5px;

}

button {

 background-color: purple;

 color: white;

 border: none;

 padding: 10px 20px;

 font-size: 16px;

 border-radius: 6px;

 cursor: pointer;

 margin-top: 15px;

}

button:hover {

 background-color: darkviolet;

}

  </style>

<script>

function addSkills() {

 // WHILE LOOP

 let i = 0;

 while (i < 2) {

 let skill = prompt("Enter frontend skill:");

 if (skill) {

 let li = document.createElement("li");

 li.innerText = skill;

   document.getElementById("frontend").appendChild(li);

 }

 i++;

}

 let again;

 do {

 let skill = prompt("Enter framework skill:");

 if (skill) {

 let li = document.createElement("li");

 li.innerText = skill;

 document.getElementById("framework").appendChild(li);

 }

 again = confirm("Add more framework skills?");

 } while (again);

}
 </script>
