<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATM MACHINE</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: #f0f4ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container{
    width: 350px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
}

h2{
    text-align: center;
    color: #2563eb;
}

label{
    font-weight: bold;
}

select,
input{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border: 1px solid #93c5fd;
    border-radius: 5px;
}

button{
    width: 100%;
    padding: 10px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover{
    background: #1d4ed8;
}

#output{
    margin-top: 15px;
    padding: 10px;
    background: #eff6ff;
    border-left: 5px solid #2563eb;
    border-radius: 5px;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <h2>ATM MACHINE</h2>

    <!-- PIN CODE -->
    <label>Enter PIN Code</label>
    <input type="password" id="pin" placeholder="Enter 4-digit PIN">

    <!-- OPTION -->
    <label>Select Option</label>

    <select id="option">
        <option value="">--Choose--</option>
        <option value="withdraw">Withdraw</option>
        <option value="deposit">Deposit</option>
    </select>

    <!-- AMOUNT -->
    <label>Enter Amount</label>
    <input type="number" id="amount" placeholder="Enter amount">

    <!-- BUTTON -->
    <button onclick="atmMachine()">Submit</button>

    <!-- OUTPUT -->
    <div id="output"></div>

</div>

<script>

let balance = 5000;
let correctPin = "1234";

function atmMachine(){

    let pin = document.getElementById("pin").value;
    let option = document.getElementById("option").value;
    let amount = Number(document.getElementById("amount").value);
    let output = document.getElementById("output");

    // CHECK PIN
    if(pin !== correctPin){

        output.innerHTML = "Incorrect PIN Code";
        return;

    }

    // WITHDRAW
    if(option === "withdraw"){

        if(amount <= balance && amount > 0){

            balance = balance - amount;

            output.innerHTML =
            "Withdrawal Successful <br> Remaining Balance = ₹" + balance;

        }else{

            output.innerHTML = "Insufficient Balance";

        }

    }

    // DEPOSIT
    else if(option === "deposit"){

        if(amount > 0){

            balance = balance + amount;

            output.innerHTML =
            "Deposit Successful <br> Updated Balance = ₹" + balance;

        }else{

            output.innerHTML = "Enter valid amount";

        }

    }


    // INVALID OPTION
    else{

        output.innerHTML = "Please select an option";

    }

}

</script>

</body>
</html>
